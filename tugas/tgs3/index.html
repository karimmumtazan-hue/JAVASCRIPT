<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CRUD Sederhana - Phase 4</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 10px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 5px; }
        button { padding: 5px 10px; cursor: pointer; font-weight: bold; border-radius: 4px; border: none; }
        .btn-submit { width: 100%; padding: 10px; background: #3498db; color: white; margin-top: 10px; }
        .btn-edit { background: #f1c40f; color: black; margin-right: 5px; }
        .btn-delete { background: #e74c3c; color: white; }
        ul { list-style: none; padding: 0; margin-top: 15px; }
        li { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #3498db; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Daftar Nilai Siswa (CRUD)</h2>

        <!-- 17. ➕ CREATE FORM -->
        <form id="studentForm">
            <input type="hidden" id="editIndex" value="-1"> <!-- Flag Penanda Mode Edit -->
            <div class="form-group">
                <label>Nama Siswa:</label>
                <input id="nameInput" type="text" required>
            </div>
            <div class="form-group">
                <label>Nilai Ujian:</label>
                <input id="scoreInput" type="number" required>
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">➕ Tambah Siswa</button>
        </form>

        <!-- 18. 👀 READ TARGET -->
        <ul id="studentList"></ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.querySelector("#studentForm");
            const nameInput = document.querySelector("#nameInput");
            const scoreInput = document.querySelector("#scoreInput");
            const editIndex = document.querySelector("#editIndex");
            const submitBtn = document.querySelector("#submitBtn");
            const list = document.querySelector("#studentList");

            // Database Array (Mengambil dari LocalStorage)
            let students = JSON.parse(localStorage.getItem("crud_students")) || [
                { name: "Ahmad", score: 90 },
                { name: "Budi", score: 80 }
            ];

            // 18. 👀 READ & RENDER DATA
            function renderStudents() {
                list.innerHTML = ""; // Kosongkan tampilan
                localStorage.setItem("crud_students", JSON.stringify(students)); // Simpan data terbaru

                students.forEach((student, index) => {
                    const item = document.createElement("li");
                    item.innerHTML = `
                        <div><strong>${student.name}</strong> <br> <small>Score: ${student.score}</small></div>
                        <div>
                            <button class="btn-edit" onclick="persiapkanEdit(${index})">✏️ Edit</button>
                            <button class="btn-delete" onclick="hapusSiswa(${index})">🗑️ Hapus</button>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }

            // 17. ➕ CREATE & 20. ✏️ UPDATE HANDLER
            form.addEventListener("submit", function(event) {
                event.preventDefault();
                
                const index = parseInt(editIndex.value);
                const studentData = { name: nameInput.value.trim(), score: parseInt(scoreInput.value) };

                if (index === -1) {
                    // Mode Create: Masukkan data baru ke array
                    students.push(studentData);
                } else {
                    // Mode Update: Ganti data lama pada index target dengan data baru
                    students[index] = studentData;
                    editIndex.value = "-1"; // Reset flag ke mode create
                    submitBtn.textContent = "➕ Tambah Siswa";
                }

                renderStudents(); // Render ulang UI
                form.reset();
            });

            // 19. 🗑️ DELETE
            window.hapusSiswa = function(index) {
                students.splice(index, 1); // Hapus dari Array
                renderStudents();          // Render ulang UI
            };

            // 20. ✏️ UPDATE (Persiapan Memasukkan Data Lama ke Input Form)
            window.persiapkanEdit = function(index) {
                nameInput.value = students[index].name;
                scoreInput.value = students[index].score;
                editIndex.value = index; // Simpan indeks yang sedang diedit
                submitBtn.textContent = "💾 Simpan Perubahan"; // Ubah teks tombol
            };

            renderStudents(); // Jalankan saat pertama kali web dibuka
        });
    </script>
</body>
</html>
